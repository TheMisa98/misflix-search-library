[project]
name = "misflix-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "python-dotenv>=1.0.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.2.0",
  "curl-cffi>=0.15.0",
]

[project.scripts]
misflix = "misflix.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
addopts = "--cov=misflix --cov-report=term-missing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["misflix"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# D: exige que los docstrings existentes sigan el formato Google (secciones,
# puntuacion, etc.) sin forzar que TODO tenga uno — los D1xx ("falta
# docstring") quedan afuera a proposito, porque el proyecto documenta helpers
# privados triviales sin docstring de forma consistente.
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Los tests documentan el "por que" de cada caso en el nombre del test mismo
# (convencion ya usada en todo tests/); no se les exige formato Google.
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.14"
files = ["misflix", "main.py"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
